<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f4f8f">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<link rel="stylesheet" href="./style.css">
<title>英検 Vocabulary</title>
</head>
<body>
<main class="app">
  <div class="top">
    <div><div class="sub">中学基礎〜英検準1級</div><h1>Vocabulary</h1><div class="sub">単語カード・4択・苦手語復習</div></div>
    <button id="speak" aria-label="発音">🔊</button>
  </div>
  <div class="stats">
    <div class="stat"><div class="label">学習済み</div><div class="value"><span id="learned">0</span>/<span id="total">0</span></div></div>
    <div class="stat"><div class="label">正答率</div><div class="value" id="acc">—</div></div>
    <div class="stat"><div class="label">苦手語</div><div class="value" id="weak">0</div></div>
  </div>
  <div class="sub" style="display:flex;justify-content:space-between"><span>全体進捗</span><span id="pct">0%</span></div>
  <div class="progress"><div id="bar"></div></div>
  <div class="row">
    <div class="field"><label for="level">レベル</label><select id="level"><option value="all">すべて</option><option value="basic">中学基礎</option><option value="3">英検3級</option><option value="pre2">英検準2級</option><option value="2">英検2級</option><option value="pre1">英検準1級</option></select></div>
    <div class="field"><label for="mode">モード</label><select id="mode"><option value="card">単語カード</option><option value="quiz">4択テスト</option><option value="weak">苦手語復習</option></select></div>
  </div>
  <section class="card">
    <div>
      <span id="badge" class="badge">—</span>
      <div id="word" class="word">Loading...</div>
      <div id="pos" class="pos"></div>
      <div id="meaning" class="meaning hidden"></div>
      <div id="example" class="example hidden"></div>
      <div id="exampleJa" class="example hidden"></div>
      <div id="choices" class="choices hidden"></div>
      <div id="feedback" class="feedback"></div>
    </div>
    <div>
      <div id="actions" class="actions"><button id="show" class="primary">意味を見る</button><button id="next">次の単語</button></div>
      <div id="ratings" class="ratings hidden"><button data-rate="hard">苦手</button><button data-rate="ok">もう一度</button><button data-rate="good" class="primary">覚えた</button></div>
    </div>
  </section>
  <div class="panel">
    <b>PWA版</b><div class="small">ホーム画面に追加すると独立アプリのように起動できます。学習履歴は端末内に保存されます。</div>
  </div>
</main>
<script src="./app.js"></script>
</body>
</html>
